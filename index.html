
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creche da Vi - Ficha de Personagens</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; color: #333; margin: 0; padding: 20px; }
        h1 { text-align: center; font-size: 2.5rem; margin-bottom: 30px; color: #1a1a1a; }
        .compass-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); padding: 25px 20px; display: flex; flex-direction: column; align-items: center; transition: transform 0.2s ease-in-out; }
        .card:hover { transform: translateY(-5px); }
        .avatar-link { display: block; margin-bottom: 20px; transition: opacity 0.2s; }
        .avatar-link:hover { opacity: 0.8; }
        .avatar { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; background-color: #e9ecef; border: 4px solid #f0f0f0; display: block; }
        
        .info { width: 100%; text-align: left; margin-bottom: 15px; padding-left: 10px; }
        .info p { margin: 8px 0; font-size: 1.1rem; }
        .info strong { color: #000; }
        
        .summary { width: 100%; font-size: 0.95rem; color: #555; text-align: justify; line-height: 1.5; border-top: 1px solid #eee; padding-top: 15px; margin-top: auto; }
        
        .loading { text-align: center; font-size: 1.2rem; color: #666; margin-top: 50px; font-weight: bold; }
        
        /* Um avisinho discreto lá no fundo para mostrar que está a atualizar sozinho */
        .live-status { text-align: center; font-size: 0.8rem; color: #999; margin-top: 30px; }
    </style>

    <script>
        function tentarProximaImagem(imgElement) {
            let urls = imgElement.getAttribute('data-urls').split(',');
            let indexAtual = parseInt(imgElement.getAttribute('data-index') || '0');
            indexAtual++;
            
            if (indexAtual < urls.length) {
                imgElement.setAttribute('data-index', indexAtual);
                imgElement.src = urls[indexAtual];
                imgElement.parentElement.href = urls[indexAtual];
            } else {
                imgElement.onerror = null; 
            }
        }
    </script>
</head>
<body>
    
    <h1>Creche da Vi<br>Ficha de Personagens</h1>
    
    <div id="loading" class="loading">A ler os dados da planilha ao vivo... ⏳</div>
    <div id="compass-container" class="compass-container"></div>
    <div class="live-status">🟢 Ligado à planilha (Atualiza automaticamente)</div>

    <script>
        const csvUrlBase = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTXNjZ0XidEUQHJmV-0TJEN8W6KFIsl6g98SZRUx2UWvCM1gelUB_SkVeaO-2UHOU8WRQfd6GB63LI8/pub?output=csv';
        const urlBaseFotos = 'https://raw.githubusercontent.com/gabrielabragaoliveira/teste-de-ficha-de-personagens/main/fotos/';

        // Transformámos a leitura numa "Função" para podermos chamá-la de tempos a tempos
        function carregarPersonagens() {
            // O Truque do Cache-Buster: adiciona a hora exata ao final do link para forçar o Google a dar os dados novos
            const urlAoVivo = csvUrlBase + '&t=' + new Date().getTime();

            Papa.parse(urlAoVivo, {
                download: true,
                header: false, 
                complete: function(results) {
                    document.getElementById('loading').style.display = 'none';
                    const container = document.getElementById('compass-container');
                    
                    // Limpa as cartas antigas antes de desenhar as novas
                    container.innerHTML = ''; 
                    
                    const data = results.data;

                    for (let i = 1; i < data.length; i++) {
                        const row = data[i];

                        if (!row[0] || row[0].trim() === '') continue;

                        const nome = row[0] ? row[0].trim() : '';
                        const apelido = row[1] ? row[1].trim() : '';
                        const local = row[2] ? row[2].trim() : '';
                        const ocupacao = row[3] ? row[3].trim() : '';
                        const resumo = row[4] ? row[4].trim() : '';
                        const arquivoFoto = row[5] ? row[5].trim() : '';

                        const apelidoLimpo = apelido.replace(/[-\s—–]/g, '');
                        let linhaApelidoHTML = '';
                        if (apelidoLimpo !== '') {
                            linhaApelidoHTML = `<p><strong>Apelido:</strong> ${apelido}</p>`;
                        }

                        let listaDeLinks = [];
                        const nomeUrl = encodeURIComponent(nome);
                        const nomeMinusc = encodeURIComponent(nome.toLowerCase());
                        const nomeSemEspacos = encodeURIComponent(nome.replace(/\s+/g, ''));
                        const nomeMinuscSemEspacos = encodeURIComponent(nome.toLowerCase().replace(/\s+/g, ''));

                        if (arquivoFoto !== '') {
                            if (arquivoFoto.toLowerCase().startsWith('http')) {
                                listaDeLinks.push(arquivoFoto);
                            } else {
                                listaDeLinks.push(`${urlBaseFotos}${encodeURIComponent(arquivoFoto)}`);
                                listaDeLinks.push(`${urlBaseFotos}${encodeURIComponent(arquivoFoto.toLowerCase())}`);
                            }
                        }

                        listaDeLinks.push(`${urlBaseFotos}${nomeUrl}.png`);
                        listaDeLinks.push(`${urlBaseFotos}${nomeUrl}.jpg`);
                        listaDeLinks.push(`${urlBaseFotos}${nomeMinusc}.png`);
                        listaDeLinks.push(`${urlBaseFotos}${nomeMinusc}.jpg`);
                        listaDeLinks.push(`${urlBaseFotos}${nomeSemEspacos}.png`);
                        listaDeLinks.push(`${urlBaseFotos}${nomeMinuscSemEspacos}.png`);
                        
                        listaDeLinks.push(`https://ui-avatars.com/api/?name=${nomeUrl}&background=random&color=fff&size=150`);

                        listaDeLinks = [...new Set(listaDeLinks)];
                        const stringDeLinks = listaDeLinks.join(',');
                        const primeiroLink = listaDeLinks[0];

                        const cardHTML = `
                            <div class="card">
                                <a href="${primeiroLink}" target="_blank" class="avatar-link">
                                    <img class="avatar" 
                                         src="${primeiroLink}" 
                                         data-urls="${stringDeLinks}"
                                         data-index="0"
                                         onerror="tentarProximaImagem(this)" 
                                         alt="Foto de ${nome}" loading="lazy">
                                </a>
                                <div class="info">
                                    <p><strong>Nome:</strong> ${nome}</p>
                                    ${linhaApelidoHTML}
                                    <p><strong>Local:</strong> ${local}</p>
                                    <p><strong>Ocupação:</strong> ${ocupacao}</p>
                                </div>
                                <p class="summary">${resumo}</p>
                            </div>
                        `;
                        
                        container.innerHTML += cardHTML;
                    }
                },
                error: function(error) {
                    console.log('Aguardando próxima atualização...');
                }
            });
        }

        // 1. Carrega as cartas assim que a pessoa entra no site
        carregarPersonagens();

        // 2. O Relógio Mágico: Repete a função a cada 60000 milissegundos (60 segundos)
        setInterval(carregarPersonagens, 60000);

    </script>
</body>
</html>
