<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creche da Vi - Ficha de Personagens</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; color: #333; margin: 0; padding: 20px; }
        h1 { text-align: center; font-size: 2.5rem; margin-bottom: 30px; color: #1a1a1a; }
        .compass-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); padding: 25px 20px; display: flex; flex-direction: column; align-items: center; transition: transform 0.2s ease-in-out; }
        .card:hover { transform: translateY(-5px); }
        .avatar-link { display: block; margin-bottom: 20px; transition: opacity 0.2s; }
        .avatar-link:hover { opacity: 0.8; }
        .avatar { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; background-color: #e9ecef; border: 4px solid #f0f0f0; display: block; }
        .info { width: 100%; text-align: center; margin-bottom: 15px; }
        .info p { margin: 8px 0; font-size: 1.1rem; }
        .info strong { color: #000; }
        .summary { width: 100%; font-size: 0.95rem; color: #555; text-align: justify; line-height: 1.5; border-top: 1px solid #eee; padding-top: 15px; margin-top: auto; }
        .loading { text-align: center; font-size: 1.2rem; color: #666; margin-top: 50px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Creche da Vi<br>Character Compass</h1>
    
    <div id="loading" class="loading">A ler os dados da planilha ao vivo... ⏳</div>
    
    <div id="compass-container" class="compass-container"></div>

    <script>
        // O link exato da sua planilha e da sua pasta de fotos no GitHub
        const sheetId = '1u0l2XT5nEXKQc61cfGviOw4lD6RuMqn2iFjIZF2jCKk';
        const gid = '1368915959';
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
        const urlBaseFotos = 'https://raw.githubusercontent.com/gabrielabragaoliveira/teste-de-ficha-de-personagens/main/fotos/';

        // Lê a planilha do Google
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                // Esconde a mensagem de "carregando"
                document.getElementById('loading').style.display = 'none';
                
                const container = document.getElementById('compass-container');
                const data = results.data;

                // Para cada linha da planilha, cria uma carta
                data.forEach(row => {
                    if (!row.Nome) return; // Pula linhas vazias

                    const nome = row.Nome.trim();
                    const apelido = row.Apelido ? row.Apelido.trim() : '';
                    const local = row.Local ? row.Local.trim() : '';
                    const ocupacao = row['Ocupação'] ? row['Ocupação'].trim() : '';
                    const resumo = row.Resumo ? row.Resumo.trim() : '';

                    const nomeExibicao = (apelido && apelido !== '-') ? `${nome} (${apelido})` : nome;

                    // O Bot Inteligente de Fotos em JavaScript!
                    // Ele tenta achar a foto como .jpg, se der erro tenta .png, e se não achar nenhuma, cria o avatar com as iniciais.
                    const nomeParaUrl = encodeURIComponent(nome);
                    const fotoJpg = `${urlBaseFotos}${nomeParaUrl}.jpg`;
                    const fotoPng = `${urlBaseFotos}${nomeParaUrl}.png`;
                    const avatarFallback = `https://ui-avatars.com/api/?name=${nomeParaUrl}&background=random&color=fff&size=150`;

                    const cardHTML = `
                        <div class="card">
                            <a href="#" class="avatar-link">
                                <img class="avatar" 
                                     src="${fotoJpg}" 
                                     onerror="this.onerror=null; this.src='${fotoPng}'; this.onerror=function(){this.src='${avatarFallback}';};" 
                                     alt="Foto de ${nome}" loading="lazy">
                            </a>
                            <div class="info">
                                <p><strong>Nome:</strong> ${nomeExibicao}</p>
                                <p><strong>Local:</strong> ${local}</p>
                                <p><strong>Ocupação:</strong> ${ocupacao}</p>
                            </div>
                            <p class="summary">${resumo}</p>
                        </div>
                    `;
                    // Joga a carta na tela
                    container.innerHTML += cardHTML;
                });
            },
            error: function(error) {
                document.getElementById('loading').innerHTML = '❌ Ocorreu um erro ao ler a planilha. Verificou se ela está Partilhada como "Qualquer pessoa com o link"?';
            }
        });
    </script>
</body>
</html>
